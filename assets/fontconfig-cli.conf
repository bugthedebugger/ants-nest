<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- The headless CLI does not render text. Keep Electron's startup probe away
       from host font caches that may have been written by a newer Fontconfig. -->
  <cachedir prefix="xdg">ants-nest/fontconfig</cachedir>
</fontconfig>
